# Example nginx configuration demonstrating HLS segment notification
# This configuration shows how to use the on_hls_segment callback to monitor
# and process HLS segments as they are created.

# Basic nginx configuration
worker_processes auto;
error_log logs/error.log info;

events {
    worker_connections 1024;
}

# HTTP server for serving HLS content and handling callbacks
http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Define custom log formats for segment notifications
    # These formats extract GET parameters sent by nginx-rtmp
    # Note: We use 'notify_method get;' in RTMP applications to send data as query parameters
    # instead of POST body, which makes them accessible via $arg_* variables in nginx logs
    
    # Detailed segment log format - captures all available metadata for main callback
    # Used by: /on_hls_segment location
    log_format segment_data '$remote_addr - $request_time - '
                            'module=$arg_module '
                            'name=$arg_name '
                            'segment=$arg_segment '
                            'sequence=$arg_sequence '
                            'duration=$arg_duration '
                            'playlist=$arg_playlist '
                            'video_codec=$arg_video_codec '
                            'audio_codec=$arg_audio_codec '
                            'video_bitrate=$arg_video_bitrate '
                            'audio_bitrate=$arg_audio_bitrate '
                            'width=$arg_width '
                            'height=$arg_height '
                            'frame_rate=$arg_frame_rate '
                            'variant_suffix=$arg_variant_suffix '
                            'variant_params=$arg_variant_params '
                            'avc_profile=$arg_avc_profile '
                            'avc_compat=$arg_avc_compat '
                            'avc_level=$arg_avc_level '
                            'aac_profile=$arg_aac_profile '
                            'hevc_profile=$arg_hevc_profile '
                            'hevc_level=$arg_hevc_level';
    
    # Advanced segment log format - for conditional HLS/DASH logging
    log_format segment_advanced '$time_iso8601 [$status] '
                                'call=$arg_call '
                                'module=$arg_module '
                                'stream=$arg_name '
                                'seq=$arg_sequence '
                                'dur=$arg_duration '
                                'file=$arg_segment '
                                'v_codec=$arg_video_codec '
                                'a_codec=$arg_audio_codec '
                                'v_br=$arg_video_bitrate '
                                'a_br=$arg_audio_bitrate '
                                'width=$arg_width '
                                'height=$arg_height '
                                'fps=$arg_frame_rate '
                                'variant=$arg_variant_suffix';

    # Server for HLS playback and segment notifications
    server {
        listen 8090;
        server_name localhost;

        # Access log for HTTP requests
        access_log logs/http_access.log;

        # Serve HLS content to players
        location /hls {
            # Serve HLS files
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            
            # Disable caching for live streams
            add_header Cache-Control no-cache;
            
            # Allow CORS for development/testing
            add_header Access-Control-Allow-Origin *;
        }

        # Simple segment notification handler
        # In production, this would be replaced with your actual backend service
        location /on_hls_segment {
            # Log all segment notifications with detailed POST data
            # (log_format segment_data is defined in http block above)
            access_log logs/segment_notifications.log segment_data;
            
            # Return success immediately
            return 200 "Segment received\n";
            
            # In a real application, you would:
            # - Forward to a backend service
            # - Upload segments to cloud storage
            # - Trigger transcoding
            # - Update analytics
            # Example: proxy_pass http://your-backend-service;
        }

        # Example: More sophisticated handler with conditional logic
        location /on_hls_segment_advanced {
            # This would typically be handled by your application server
            # (Node.js, Python, Go, etc.)
            # (log_format segment_advanced is defined in http block above)
            
            if ($arg_module = "hls") {
                # Handle HLS-specific logic
                access_log logs/hls_segments.log segment_advanced;
            }
            
            if ($arg_module = "dash") {
                # Handle DASH-specific logic
                access_log logs/dash_segments.log segment_advanced;
            }
            
            return 200;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
        }
        
        # Alternative: Log raw POST body for debugging
        # This example shows how to capture the complete POST data
        location /on_hls_segment_raw {
            # Enable detailed error logging
            error_log logs/segment_debug.log debug;
            
            # Log with standard combined format to see full request
            access_log logs/segment_raw.log combined;
            
            # You can use Lua (if nginx is compiled with lua module) to log POST body:
            # access_by_lua_block {
            #     ngx.req.read_body()
            #     local body = ngx.req.get_body_data()
            #     ngx.log(ngx.INFO, "POST body: ", body)
            # }
            
            return 200 "OK\n";
        }

        # Simple HTML page for testing playback
        location / {
            root html;
            index index.html;
        }
    }
}

# RTMP configuration
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        # Access log for RTMP connections
        access_log logs/rtmp_access.log;

        # Application for live streaming with HLS
        application live {
            live on;
            
            # Enable HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 5s;
            hls_playlist_length 30s;
            hls_cleanup on;
            hls_nested on;
            
            # Use GET method for notifications so parameters are accessible via $arg_*
            # This allows nginx to log the POST data easily
            notify_method get;
            
            # Segment notification callback
            # This is called every time a new HLS segment is created
            on_hls_segment http://localhost:8090/on_hls_segment;
            
            # Allow publishing from localhost only (for security)
            allow publish 127.0.0.1;
            allow publish 192.168.0.0/16;
            deny publish all;
            
            # Allow playing from anywhere
            allow play all;
        }

        # Application demonstrating multi-bitrate HLS with segment notifications
        application live-abr {
            live on;
            
            # Enable HLS with variants
            hls on;
            hls_path /tmp/hls-abr;
            hls_fragment 4s;
            hls_playlist_length 20s;
            hls_cleanup on;
            hls_nested on;
            
            # Use GET method for notifications
            notify_method get;
            
            # Define multiple quality variants
            # These will generate separate callbacks for each variant
            hls_variant _low BANDWIDTH=400000,RESOLUTION=640x360;
            hls_variant _mid BANDWIDTH=800000,RESOLUTION=854x480;
            hls_variant _high BANDWIDTH=2000000,RESOLUTION=1280x720;
            
            # Segment notification - will receive variant information
            on_hls_segment http://localhost:8090/on_hls_segment_advanced;
            
            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }

        # Application with DASH and segment notifications
        application live-dash {
            live on;
            
            # Enable both HLS and DASH
            hls on;
            hls_path /tmp/hls-dash;
            hls_fragment 5s;
            hls_nested on;
            
            dash on;
            dash_path /tmp/dash;
            dash_fragment 5s;
            dash_nested on;
            
            # Use GET method for notifications
            notify_method get;
            
            # Will receive callbacks for both HLS and DASH segments
            # Check the 'module' parameter to distinguish between them
            on_hls_segment http://localhost:8090/on_hls_segment;
            
            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }
    }
}

################################################################################
# USAGE INSTRUCTIONS
################################################################################
#
# 1. Start nginx with this configuration:
#    $ nginx -c /path/to/nginx-hls-segment-notify.conf
#
# 2. Publish a stream using OBS, FFmpeg, or similar:
#    $ ffmpeg -re -i input.mp4 -c:v libx264 -c:a aac -f flv rtmp://localhost/live/mystream
#
# 3. Watch the segment notification logs:
#    $ tail -f logs/segment_notifications.log
#
# 4. Play the HLS stream:
#    - VLC: Open Network Stream -> http://localhost:8090/hls/mystream/index.m3u8
#    - FFplay: ffplay http://localhost:8090/hls/mystream/index.m3u8
#    - Browser: Use video.js, hls.js, or native HLS support (Safari)
#
# 5. View segment notification logs:
#    
#    Detailed log with all POST parameters:
#    $ tail -f logs/segment_notifications.log
#    
#    Example log output:
#    127.0.0.1 - 0.001 - module=hls name=mystream segment=/tmp/hls/mystream/mystream-1634567890.ts sequence=42 duration=5.000 playlist=/tmp/hls/mystream/index.m3u8 video_codec=H264 audio_codec=AAC video_bitrate=2500000 audio_bitrate=128000 width=1280 height=720 frame_rate=30.000 variant_suffix= variant_params= avc_profile=100 avc_compat=0 avc_level=31 aac_profile=1 hevc_profile=0 hevc_level=0
#    
#    Separate HLS and DASH logs (for live-dash application):
#    $ tail -f logs/hls_segments.log
#    $ tail -f logs/dash_segments.log
#    
#    Example compact log output:
#    2025-10-19T14:23:45-04:00 mystream seq=42 dur=5.000
#    2025-10-19T14:23:50-04:00 mystream seq=43 dur=5.012
#    
#    View raw HTTP requests (for debugging):
#    $ tail -f logs/segment_raw.log
#
# 6. Example segment notification data you'll receive:
#    
#    With notify_method get, the callback URL will be:
#    http://localhost:8090/on_hls_segment?call=hls_segment&module=hls&name=mystream&...
#    
#    Parameters sent:
#    call=hls_segment
#    module=hls
#    name=mystream
#    playlist=/tmp/hls/mystream/index.m3u8
#    segment=/tmp/hls/mystream/mystream-1634567890.ts
#    sequence=42
#    duration=5.000
#    video_codec=H264
#    audio_codec=AAC
#    video_bitrate=2500000
#    audio_bitrate=128000
#    width=1280
#    height=720
#    frame_rate=30.000
#    avc_profile=100
#    avc_compat=0
#    avc_level=31
#    aac_profile=1
#    hevc_profile=0
#    hevc_level=0
#
################################################################################

################################################################################
# PRODUCTION DEPLOYMENT NOTES
################################################################################
#
# For production use, consider:
#
# 1. Replace the simple notification handler with a proper backend service
#    that can handle high request volumes and implement your business logic
#
# 2. Use the segment notifications to:
#    - Upload segments to cloud storage (S3, GCS, Azure Blob)
#    - Trigger cloud transcoding services
#    - Update real-time analytics dashboards
#    - Implement custom DRM or encryption
#    - Monitor stream quality and health
#    - Generate thumbnails or preview clips
#
# 3. Security considerations:
#    - Use HTTPS for callbacks (configure SSL certificates)
#    - Implement authentication for publish endpoints
#    - Validate callback payloads
#    - Rate limit callback handlers
#    - Use allow/deny directives to restrict access
#
# 4. Performance optimization:
#    - Use async/non-blocking handlers for callbacks
#    - Consider queueing systems (Redis, RabbitMQ) for segment processing
#    - Monitor callback response times
#    - Implement retry logic for failed callbacks
#
# 5. Monitoring:
#    - Set up alerts for callback failures
#    - Track segment creation rates
#    - Monitor storage usage
#    - Log segment metadata for analytics
#
# 6. Log Analysis:
#    
#    Parse segment logs for analytics:
#    $ awk '{print $5}' logs/segment_notifications.log | sort | uniq -c
#    
#    Calculate average segment duration:
#    $ grep duration= logs/segment_notifications.log | \
#      grep -oP 'duration=\K[0-9.]+' | \
#      awk '{sum+=$1; count++} END {print sum/count}'
#    
#    Track bitrates over time:
#    $ grep video_bitrate= logs/segment_notifications.log | \
#      grep -oP 'video_bitrate=\K[0-9]+' | \
#      tail -20
#    
#    Monitor segment creation rate:
#    $ watch -n 1 'tail -1 logs/segment_notifications.log'
#
